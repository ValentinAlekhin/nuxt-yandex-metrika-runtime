name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish to npm; disable if this version is already published
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  version:
    name: Check version tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Compare tag, package.json and lock file
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            echo 'Run the release workflow on a version tag, for example v0.1.0.' >&2
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          lock_version=$(node -p "require('./package-lock.json').version")
          lock_root_version=$(node -p "require('./package-lock.json').packages[''].version")
          if [[ "$GITHUB_REF_NAME" != "v$version" || "$version" != "$lock_version" || "$version" != "$lock_root_version" ]]; then
            echo 'The tag and versions in package.json and package-lock.json must match.' >&2
            exit 1
          fi

  checks:
    name: Check release build
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm and GitHub
    needs: [version, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out tested source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with OIDC support
        run: npm install --global npm@11
      - name: Install dependencies
        run: npm ci
      - name: Download tested archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: npm-package
          path: artifacts
      - name: Publish with release-it
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_NPM: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_npm }}
        run: |
          args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--npm.tag=next)
          fi
          if [[ "$PUBLISH_NPM" == false ]]; then
            args+=(--no-npm)
          fi
          npm run release:ci -- "${args[@]}"
